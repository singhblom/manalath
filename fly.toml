# Fly.io config for Manalath. Deploy with `fly deploy`; see "Deploy to Fly.io" in README.md.
#
# The server keeps live matches and flag timers in memory and owns its SQLite file, so it must
# run as exactly one machine that never stops: no autoscaling, no auto-stop, one volume.
app = "manalath"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/manalath.sqlite"
  PUBLIC_URL = "https://manalath.fly.dev"
  # ARBITER_DID = "did:plc:..."   # optional: stamp challenges with this server's DID

[[mounts]]
  source = "manalath_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/xrpc/_health"

[deploy]
  # Two machines sharing the database would both arm flag timers, so never overlap old and new.
  strategy = "immediate"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
